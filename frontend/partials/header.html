<header class="app-header">
  <div class="logo-group" style="display: flex; align-items: center; gap: 0.5rem;">
    <a href="index.html" class="nav-brand navbar-brand logo-container" aria-label="Thatworkx AEO Suite" style="display: flex; align-items: center; text-decoration: none;">
      <img 
        id="site-logo" src="src/images/ai-thatworkx-logo-dark.png" 
        alt="Thatworkx AEO Suite" 
        class="brand-logo" 
        height="36" 
      />
    </a>
  </div>
  
  <nav class="nav-links flex items-center gap-3" style="display: flex; gap: 0.75rem; align-items: center;">
    <a href="visualize.html" class="nav-logo-btn" data-nav="visualize" data-logo="AIVisualize" title="AI Visualize" aria-label="AI Visualize" style="display: inline-flex; align-items: center; justify-content: center; min-width: auto; height: 42px; padding: 0.25rem 0.6rem;">
      <img src="src/images/aivisualize-logo.png" alt="AI Visualize" height="36" class="nav-product-logo" style="height: 36px; width: auto; object-fit: contain;" />
    </a>
    <a href="optimize.html" class="nav-logo-btn" data-nav="optimize" data-logo="AIOptimize" title="AIOptimize" aria-label="AIOptimize" style="display: inline-flex; align-items: center; justify-content: center; min-width: auto; height: 42px; padding: 0.25rem 0.6rem;">
      <img src="src/images/aioptimize-logo.svg" alt="AIOptimize" height="36" class="nav-product-logo" style="height: 36px; width: auto; object-fit: contain;" />
    </a>
    <a href="socialize.html" class="nav-logo-btn" data-nav="socialize" data-logo="AISocialize" title="AISocialize" aria-label="AISocialize" style="display: inline-flex; align-items: center; justify-content: center; min-width: auto; height: 42px; padding: 0.25rem 0.6rem;">
      <img src="src/images/aisocialize-logo.png" alt="AISocialize" height="36" class="nav-product-logo" style="height: 36px; width: auto; object-fit: contain;" />
    </a>
  </nav>

  <div class="header-actions flex items-center gap-3">
    <div class="tier-badge-container">
      <span class="tier-label">Plan:</span>
      <select id="user-tier-selector" class="tier-select" onchange="updateUserTier()">
        <option value="AIVisualize Free">AIVisualize Free</option>
        <option value="AIVisualize Pro">AIVisualize Pro</option>
        <option value="AIVisualize ENT">AIVisualize ENT</option>
        <option value="AIOptimize Free">AIOptimize Free</option>
        <option value="AIOptimize Pro">AIOptimize Pro</option>
        <option value="AIOptimize ENT">AIOptimize ENT</option>
      </select>
    </div>
    <button class="auth-trigger-btn" id="auth-btn" onclick="openAuthModal()">🔑 Sign In</button>
  </div>
</header>
